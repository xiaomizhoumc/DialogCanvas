site_name: DialogCanvas 中文文档
site_description: Paper 原生 Dialog 菜单插件：安装、可视化编辑、YAML 与运维教程
site_url: https://xiaomizhoumc.github.io/DialogCanvas/
repo_url: https://github.com/xiaomizhoumc/DialogCanvas
repo_name: xiaomizhoumc/DialogCanvas
edit_uri: edit/main/docs/wiki/
docs_dir: docs/wiki
site_dir: site
strict: true

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/message-text-outline
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

plugins:
  - search:
      lang: zh

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: README.md
  - 入门:
      - 插件用途与能力范围: 01-start/overview.md
      - 安装、目录与登录: 01-start/installation.md
      - 十分钟创建第一个菜单: 01-start/first-menu.md
  - 网页编辑器:
      - 菜单管理与保存: 02-editor/management.md
      - 三栏布局、组件与拖拽: 02-editor/components.md
      - 文字、颜色、渐变与图标: 02-editor/text.md
      - 导航与商店: 02-editor/logic.md
      - 预览、撤销与异常: 02-editor/workflow.md
  - YAML 配置:
      - 基础与常见语法错误: 03-yaml/basics.md
      - JSON、YAML、同步与版本: 03-yaml/storage.md
      - 从最小到完整菜单: 03-yaml/tutorial.md
  - 功能专题:
      - 导航与主菜单快捷入口: 04-features/navigation.md
      - 权限、条件与错误: 04-features/conditions.md
      - 玩家、OP 与控制台命令: 04-features/commands.md
      - Vault 经济与买卖: 04-features/commerce.md
      - PAPI 变量: 04-features/placeholders.md
      - 物品、附魔与属性: 04-features/items.md
      - 玩家数据、限购与事务: 04-features/data-transactions.md
      - 归档、恢复与审计: 04-features/maintenance.md
  - 运维与排错:
      - 命令与权限: 05-operations/commands.md
      - 插件配置表: 05-operations/configuration.md
      - 更新、备份与恢复: 05-operations/operations.md
      - 常见问题: 05-operations/troubleshooting.md
      - 已知限制与人工验收: 05-operations/limits.md
  - 示例与参考:
      - 示例索引: 06-reference/examples.md
      - 菜单与输入字段: 06-reference/menu-fields.md
      - 按钮、条件与动作: 06-reference/conditions-actions.md
      - 变量与表达式: 06-reference/variables.md
      - 错误码: 06-reference/errors.md
      - 术语与权威顺序: 06-reference/glossary.md
      - 验收范围: 06-reference/acceptance.md
